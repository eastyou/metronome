[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metronome"
version = "0.1.0"
description = "课堂节拍器：单文件、离线可用的网页节拍器"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["metronome", "music", "practice", "teacher", "offline", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
metronome = "metronome.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/metronome"
Source = "https://github.com/eastyou/metronome"

[tool.setuptools]
packages = ["metronome"]
